<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantier Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #101010;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 32px;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }

    .accent {
      color: #E8920A;
    }

    .subtitle {
      color: #888;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      background: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
      padding: 13px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #E8920A;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #E8920A;
      color: #050505;
      font-weight: 800;
      padding: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      color: #ff6961;
    }

    .success {
      color: #69db7c;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="brand">FANTIER<span class="accent">.</span></div>
    <div class="subtitle">Administration</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

      <div id="message"></div>
    </form>
  </div>

<script>
const SB_URL = "https://mbkanieqhxryeksalrti.supabase.co";

/*
  Use the SAME public anon key already used in
  fantier-v5-clean-v4.html.

  Never put SUPABASE_SERVICE_ROLE_KEY here.
*/
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ia2FuaWVxaHhyeWVrc2FscnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NDAxNDksImV4cCI6MjA5ODMxNjE0OX0.p1-twI9aD5AGpmbKfU-EZ1FEexdAfEC-ViUApaPDWg4";
const SB_HDR  = { "Content-Type":"application/json", "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY };
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Signing in...";
  message.textContent = "";
  message.className = "";

  try {
    const response = await fetch(
      `${SB_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SB_KEY
        },
        body: JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.access_token) {
      throw new Error(data.error_description || data.msg || "Unable to sign in.");
    }

    /*
      Temporary for tonight:
      prove Supabase authentication works.

      We are NOT building privileged order operations yet.
    */
    sessionStorage.setItem(
      "fantier_admin_session",
      JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in * 1000)
      })
    );

    message.textContent = "Admin authentication successful.";
    message.className = "success";

  } catch (error) {
    console.error(error);
    message.textContent = error.message || "Unable to sign in.";
    message.className = "error";

  } finally {
    button.disabled = false;
    button.textContent = "Sign In";
  }
});
</script>

</body>
</html>
